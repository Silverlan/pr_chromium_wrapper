name: Build and Release
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

env:
  # See https://github.com/git-lfs/git-lfs/issues/5749
  GIT_CLONE_PROTECTION_ACTIVE: 'false'

jobs:
  build:
    name: Build - ${{ matrix.config.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup cmake
        if: runner.os == 'Linux'
        uses: jwlawson/actions-setup-cmake@v2

      - name: Setup Custom Clang (Linux)
        shell: bash
        if: runner.os == 'Linux'
        run: |
          # Due to a clang bug, we need a pre-release version of clang
          curl -L https://github.com/Silverlan/clang_prebuilt/releases/download/2025-12-19/linux_x64.tar.xz -o clang_prebuilt.tar.xz
          
          mkdir clang_custom
          tar -xf clang_prebuilt.tar.xz -C clang_custom --strip-components=1
          
          CLANG_BIN_PATH="$(pwd)/clang_custom/bin"
          echo "$CLANG_BIN_PATH" >> $GITHUB_PATH
          
          echo "CC=$CLANG_BIN_PATH/clang" >> $GITHUB_ENV
          echo "CXX=$CLANG_BIN_PATH/clang++" >> $GITHUB_ENV

      - name: Setup Custom CMake (Windows)
        shell: bash
        if: runner.os == 'Windows'
        run: |
          # Due to a CMake bug, we need a custom CMake version on Windows for now.
          curl -L https://github.com/Silverlan/CMake/releases/download/2025-12-23/windows_x64.tar.xz -o cmake_custom.tar.xz
          
          mkdir cmake_custom
          tar -xf cmake_custom.tar.xz -C cmake_custom --strip-components=1
          
          win_bin="$(pwd -W)/cmake_custom/bin"
          echo "PATH=$win_bin:${PATH}" >> $GITHUB_ENV

      - name: Debug
        shell: bash
        if: runner.os == 'Windows'
        run: |
          echo "=== $GITHUB_PATH contents ==="
          cat "$GITHUB_PATH" || true

          echo "=== ls cmake_custom/bin ==="
          ls -la cmake_custom/bin || true

          echo "=== PATH in this shell ==="
          echo "$PATH"

          echo "=== which / type / all cmake matches ==="
          command -v cmake || true
          which -a cmake || true
          type -a cmake || true

          echo "=== run cmake from the extracted dir (if present) ==="
          if [ -x cmake_custom/bin/cmake ]; then
            cmake_custom/bin/cmake --version || true
          else
            echo "no executable at cmake_custom/bin/cmake"
          fi

      - name: Clone Repositories
        shell: bash
        run: |
          # We need pragma for the core build_scripts
          git clone -b develop https://github.com/Silverlan/pragma.git
          cd pragma/modules
          git clone https://github.com/Silverlan/pr_chromium.git

      - name: Build Tag Name
        id: build_tag_name
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            echo "tag_name=latest" >> $GITHUB_OUTPUT
          else
            echo "tag_name=$(TZ='Europe/Berlin' date +%F)" >> $GITHUB_OUTPUT
          fi

      - name: Run Python Build Scripts
        shell: bash
        working-directory: ./pragma/modules/pr_chromium/build_scripts
        run: |
          export PATH="$PWD/cmake_custom/bin:$PATH"
          cmake --version
          python -m third_party.cef
          python -m third_party.chromium_wrapper

      - name: Copy Staging to Release
        shell: bash
        run: |
          mkdir -p release
          cp -rv pragma/modules/pr_chromium/build_scripts/deps/staging/. release/

      - name: Release Binaries
        uses: Silverlan/common_actions/release_nightly_binaries@main
        if: runner.os == 'Windows'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit: ${{ github.ref_name }}
          tag: '${{ steps.build_tag_name.outputs.tag_name }}'
          release_suffix: '-msvc'

      - name: Release Binaries
        uses: Silverlan/common_actions/release_nightly_binaries@main
        if: runner.os == 'Linux'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit: ${{ github.ref_name }}
          tag: '${{ steps.build_tag_name.outputs.tag_name }}'
          release_suffix: '-clang'
